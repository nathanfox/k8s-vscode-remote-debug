apiVersion: v1
kind: Service
metadata:
  name: elixir-phoenix
  labels:
    app: elixir-phoenix
    framework: phoenix
    language: elixir
spec:
  type: ClusterIP
  selector:
    app: elixir-phoenix
  ports:
  - name: http
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: epmd
    port: 4369
    targetPort: 4369
    protocol: TCP
  - name: debug
    port: 9000
    targetPort: 9000
    protocol: TCP