apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsharp-giraffe
  labels:
    app: fsharp-giraffe
    framework: dotnet
    language: fsharp
    version: "8.0"
    debug-enabled: "true"
    managed-by: k8s-remote-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fsharp-giraffe
  template:
    metadata:
      labels:
        app: fsharp-giraffe
        framework: dotnet
        language: fsharp
        version: "8.0"
        debug-enabled: "true"
    spec:
      containers:
      - name: fsharp-giraffe
        image: fsharp-giraffe:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Liveness probe disabled for debugging to prevent pod restarts when paused at breakpoints
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5