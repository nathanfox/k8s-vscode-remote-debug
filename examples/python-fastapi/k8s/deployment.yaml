apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-fastapi
  labels:
    app: python-fastapi
    framework: fastapi
    language: python
    version: "3.12"
    debug-enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-fastapi
  template:
    metadata:
      labels:
        app: python-fastapi
        framework: fastapi
        language: python
        version: "3.12"
        debug-enabled: "true"
    spec:
      containers:
      - name: python-fastapi
        image: python-fastapi:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 5678
          name: debug
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10