apiVersion: v1
kind: Service
metadata:
  name: csharp-webapi
  labels:
    app: csharp-webapi
    framework: dotnet
    language: csharp
    managed-by: k8s-remote-debug
spec:
  selector:
    app: csharp-webapi
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP