apiVersion: apps/v1
kind: Deployment
metadata:
  name: csharp-webapi
  labels:
    app: csharp-webapi
    framework: dotnet
    language: csharp
    version: "8.0"
    debug-enabled: "true"
    managed-by: k8s-remote-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csharp-webapi
  template:
    metadata:
      labels:
        app: csharp-webapi
        framework: dotnet
        language: csharp
        version: "8.0"
        debug-enabled: "true"
    spec:
      containers:
      - name: csharp-webapi
        image: csharp-webapi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5