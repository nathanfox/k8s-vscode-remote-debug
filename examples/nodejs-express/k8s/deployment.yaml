apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-express
  labels:
    app: nodejs-express
    framework: express
    language: nodejs
    version: "22"
    debug-enabled: "true"
    managed-by: k8s-remote-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-express
  template:
    metadata:
      labels:
        app: nodejs-express
        framework: express
        language: nodejs
        version: "22"
        debug-enabled: "true"
    spec:
      containers:
      - name: nodejs-express
        image: nodejs-express:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9229
          name: debug
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Liveness probe disabled for debugging to prevent pod restarts when paused at breakpoints
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5